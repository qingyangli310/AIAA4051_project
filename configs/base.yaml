project:
  name: AIAA4051_project6
  seed: 42

data:
  grid_size: 6
  coordinate_system: row_col_zero_based
  action_step_indexing: zero_based
  goal_not_reached_step: len_plan
  environment_split:
    train: 0.70
    dev: 0.10
    heldout_test: 0.20
  task_coverage:
    train: [generation, verification, repair]
    dev: [generation, verification, repair]
    heldout_test: [generation, verification, repair]
  test_conditions:
    id_single_error:
      environment_source: heldout_test
      scenarios: [valid, single_error]
    ood_double_error:
      environment_source: heldout_test
      scenarios: [double_error]
    pairing_key: base_sample_id
  train_examples:
    generation: 1000
    verification: 1500
    repair: 1500
  dev_examples_max: 200
  id_single_error_examples_max: 200
  ood_double_error_examples_max: 200
  include_feasible_non_optimal_valid_plans: true
  verification_valid_invalid_ratio: [1, 1]
  corruption_ratios:
    action_substitution: 0.25
    action_deletion: 0.25
    action_insertion: 0.25
    premature_stopping: 0.25

model:
  baseline_1_name: google-t5/t5-small
  baseline_1_revision: df1b051c49625cf57a3d0d8d3863ed4d13564fe4
  baseline_1_status: active
  future_alternative_name: google/flan-t5-small
  future_alternative_requires_protocol_update: true
  baseline_2_name: facebook/bart-base
  baseline_2_revision: aadd2ab0ae0c8268c7c9693540e9904811f36177
  max_input_length: 512
  max_output_length: 128

training:
  learning_rate: 5.0e-5
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 2
  num_train_epochs: 3
  optimizer: adamw_torch
  weight_decay: 0.01
  bf16: true

generation:
  num_beams: 1
  do_sample: false
  temperature: 1.0

experiment:
  improvement: structured_state_tracking_verification
  ablation: remove_state_tracking
  repair_rounds_main_baseline: 1
